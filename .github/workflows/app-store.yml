name: App Store Release

on:
  push:
    tags:
      - "v*"
      - testflight-*
  workflow_dispatch:
    inputs:
      platform:
        description: Platform archive to upload
        required: true
        default: both
        type: choice
        options:
          - both
          - ios
          - macos
      submit_for_review:
        description: Submit the uploaded build for App Store review
        required: false
        default: false
        type: boolean
      release_notes:
        description: "What's New text for the App Store version (required to submit)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_guard.outputs.should_release }}
      marketing_version: ${{ steps.next_build.outputs.marketing_version }}
      build_number: ${{ steps.next_build.outputs.build_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release only new commits on the daily schedule
        id: release_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git tag --points-at HEAD --list 'testflight-*' | grep -q . \
            || git tag --points-at HEAD --list 'daily-release-*' | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No commits have landed since the last TestFlight release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read marketing version
        if: steps.release_guard.outputs.should_release == 'true'
        id: version
        run: |
          # project.yml is the only version a bump edits. xcodegen writes the
          # same values into project.pbxproj; do not read that file here.
          marketing_version=$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/ { print $2; exit }' project.yml)
          if [[ -z "$marketing_version" ]]; then
            echo "Could not read MARKETING_VERSION from project.yml." >&2
            exit 1
          fi
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"

      - name: Prepare App Store Connect credential
        if: steps.release_guard.outputs.should_release == 'true'
        id: credential
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$PRIVATE_KEY" || -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$APPLE_TEAM_ID" ]]; then
            echo "TestFlight upload is blocked until these GitHub Actions secrets exist:" >&2
            [[ -z "$KEY_ID" ]] && echo " - APP_STORE_CONNECT_KEY_ID" >&2
            [[ -z "$ISSUER_ID" ]] && echo " - APP_STORE_CONNECT_ISSUER_ID" >&2
            [[ -z "$PRIVATE_KEY" ]] && echo " - APP_STORE_CONNECT_PRIVATE_KEY" >&2
            [[ -z "$APPLE_TEAM_ID" ]] && echo " - APPLE_TEAM_ID" >&2
            echo "See README.md for the Apple Developer setup these secrets belong to." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Select uploadable App Store version and build number
        if: steps.release_guard.outputs.should_release == 'true'
        id: next_build
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_IDENTIFIER != '' && vars.APP_BUNDLE_IDENTIFIER || 'com.harrisliangsu.whenreset' }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          RELEASE_PLATFORMS: ${{ github.event_name == 'schedule' && 'IOS' || inputs.platform == 'both' && 'IOS,MAC_OS' || inputs.platform == 'macos' && 'MAC_OS' || 'IOS' }}
        run: ruby .github/scripts/next-app-store-build.rb

      - name: Remove temporary credential
        if: always() && steps.credential.outputs.path != ''
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
        run: rm -f "$ASC_KEY_PATH"

  upload:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: Upload ${{ matrix.platform }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(github.event_name == 'schedule' && '["ios"]' || inputs.platform == 'both' && '["ios", "macos"]' || inputs.platform == 'macos' && '["macos"]' || '["ios"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Xcode 26
        uses: ./.github/actions/select-xcode

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Set up encrypted diagnostics runtime
        if: vars.RELEASE_DIAGNOSTICS_PUBLIC_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare App Store Connect credential
        id: credential
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$PRIVATE_KEY" || -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$APPLE_TEAM_ID" ]]; then
            echo "TestFlight upload is blocked until these GitHub Actions secrets exist:" >&2
            [[ -z "$KEY_ID" ]] && echo " - APP_STORE_CONNECT_KEY_ID" >&2
            [[ -z "$ISSUER_ID" ]] && echo " - APP_STORE_CONNECT_ISSUER_ID" >&2
            [[ -z "$PRIVATE_KEY" ]] && echo " - APP_STORE_CONNECT_PRIVATE_KEY" >&2
            [[ -z "$APPLE_TEAM_ID" ]] && echo " - APPLE_TEAM_ID" >&2
            echo "See README.md for the Apple Developer setup these secrets belong to." >&2
            exit 1
          fi

          key_directory="$RUNNER_TEMP/app-store-connect"
          key_path="$key_directory/AuthKey_${KEY_ID}.p8"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$key_path"

          if ! openssl pkey -in "$key_path" -noout -check >/dev/null 2>&1; then
            echo "The App Store Connect private-key secret is invalid." >&2
            exit 1
          fi

          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      # Hosted runners share an image machine identity and discard the keychain.
      # The previous archive's "Created via API" development certificate is still
      # on the team, and Xcode will not revoke it unless this step does.
      - name: Revoke orphaned CI development certificates
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_IDENTIFIER: ${{ vars.APP_BUNDLE_IDENTIFIER != '' && vars.APP_BUNDLE_IDENTIFIER || 'com.harrisliangsu.whenreset' }}
          WIDGET_BUNDLE_IDENTIFIER: ${{ vars.WIDGET_BUNDLE_IDENTIFIER != '' && vars.WIDGET_BUNDLE_IDENTIFIER || 'com.harrisliangsu.whenreset.widgets' }}
        run: ruby .github/scripts/revoke-ci-signing.rb

      - name: Archive
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_IDENTIFIER: ${{ vars.APP_BUNDLE_IDENTIFIER != '' && vars.APP_BUNDLE_IDENTIFIER || 'com.harrisliangsu.whenreset' }}
          WIDGET_BUNDLE_IDENTIFIER: ${{ vars.WIDGET_BUNDLE_IDENTIFIER != '' && vars.WIDGET_BUNDLE_IDENTIFIER || 'com.harrisliangsu.whenreset.widgets' }}
          APP_GROUP_IDENTIFIER: ${{ vars.APP_GROUP_IDENTIFIER != '' && vars.APP_GROUP_IDENTIFIER || 'group.com.harrisliangsu.whenreset' }}
          KEYCHAIN_GROUP_SUFFIX: ${{ vars.KEYCHAIN_GROUP_SUFFIX != '' && vars.KEYCHAIN_GROUP_SUFFIX || 'com.harrisliangsu.whenreset.shared' }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$RELEASE_PLATFORM" == "ios" ]]; then
            destination='generic/platform=iOS'
            archive_path="$RUNNER_TEMP/WhenReset-iOS.xcarchive"
            platform_settings=()
          else
            destination='generic/platform=macOS'
            archive_path="$RUNNER_TEMP/WhenReset-macOS.xcarchive"
            platform_settings=("ARCHS=arm64 x86_64" "ONLY_ACTIVE_ARCH=NO")
          fi

          xcodebuild archive \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination "$destination" \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES \
            APP_BUNDLE_IDENTIFIER="$APP_BUNDLE_IDENTIFIER" \
            WIDGET_BUNDLE_IDENTIFIER="$WIDGET_BUNDLE_IDENTIFIER" \
            APP_GROUP_IDENTIFIER="$APP_GROUP_IDENTIFIER" \
            KEYCHAIN_GROUP_SUFFIX="$KEYCHAIN_GROUP_SUFFIX" \
            MARKETING_VERSION='${{ needs.prepare.outputs.marketing_version }}' \
            CURRENT_PROJECT_VERSION='${{ needs.prepare.outputs.build_number }}' \
            "${platform_settings[@]}"

          if [[ "$RELEASE_PLATFORM" == "macos" ]]; then
            app_path="$archive_path/Products/Applications/WhenReset.app"
            widget_path="$app_path/Contents/PlugIns/WhenResetWidgets.appex"
            app_entitlements="$RUNNER_TEMP/WhenResetMac.xcent"
            widget_entitlements="$RUNNER_TEMP/WhenResetWidgetsMac.xcent"
            team_id="$APPLE_TEAM_ID"
            app_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")
            widget_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget_path/Contents/Info.plist")

            cp WhenReset/WhenResetMac.entitlements "$app_entitlements"
            cp WhenResetWidgets/WhenResetWidgetsMac.entitlements "$widget_entitlements"

            /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.aps-environment production' "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.application-groups:0 $APP_GROUP_IDENTIFIER" "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.application-groups:0 $APP_GROUP_IDENTIFIER" "$widget_entitlements"
            /usr/libexec/PlistBuddy -c "Set :keychain-access-groups:0 ${team_id}.${KEYCHAIN_GROUP_SUFFIX}" "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string ${team_id}.${app_bundle_id}" "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $team_id" "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string ${team_id}.${widget_bundle_id}" "$widget_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $team_id" "$widget_entitlements"

            codesign --force --sign - --entitlements "$widget_entitlements" --generate-entitlement-der "$widget_path"
            codesign --force --sign - --entitlements "$app_entitlements" --generate-entitlement-der "$app_path"
            codesign --verify --deep --strict "$app_path"

            for bundle in "$app_path" "$widget_path"; do
              signed_entitlements="$RUNNER_TEMP/$(basename "$bundle").signed.xcent"
              codesign -d --entitlements :- "$bundle" > "$signed_entitlements" 2>/dev/null
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$signed_entitlements")" == "true" ]]
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$signed_entitlements")" == "$APP_GROUP_IDENTIFIER" ]]
              bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.application-identifier' "$signed_entitlements")" == "${team_id}.${bundle_id}" ]]
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$signed_entitlements")" == "$team_id" ]]
            done

            app_signed_entitlements="$RUNNER_TEMP/WhenReset.app.signed.xcent"
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$app_signed_entitlements")" == "true" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' "$app_signed_entitlements")" == "production" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$app_signed_entitlements")" == "${team_id}.${KEYCHAIN_GROUP_SUFFIX}" ]]
          fi

          echo "archive_path=$archive_path" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_DIAGNOSTICS_PUBLIC_KEY: ${{ vars.RELEASE_DIAGNOSTICS_PUBLIC_KEY }}
          RELEASE_DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/release-diagnostics
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/AppStoreExport"

          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string automatic "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$export_options"
          plutil -insert uploadSymbols -bool YES "$export_options"

          RELEASE_DIAGNOSTICS_NODE="$(command -v node || true)" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin bash .github/scripts/export-app-store.sh \
            "$archive_path" "$export_path" "$export_options"

          echo "Uploaded ${{ matrix.platform }} archive ${{ needs.prepare.outputs.marketing_version }} (${{ needs.prepare.outputs.build_number }}) to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Save encrypted export diagnostics
        if: failure() && vars.RELEASE_DIAGNOSTICS_PUBLIC_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-release-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-diagnostics/*.sealed.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Read archived iOS version
        if: matrix.platform == 'ios'
        run: |
          marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$archive_path/Info.plist")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$archive_path/Info.plist")
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Add iOS build to Internal Testers
        if: matrix.platform == 'ios'
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_IDENTIFIER != '' && vars.APP_BUNDLE_IDENTIFIER || 'com.harrisliangsu.whenreset' }}
          TESTFLIGHT_GROUP_NAME: Internal Testers
        run: ruby .github/scripts/assign-testflight-group.rb

      - name: Mark successful automatic release
        if: matrix.platform == 'ios' && github.event_name != 'push'
        env:
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          tag="daily-release-${MARKETING_VERSION}-${BUILD_NUMBER}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Remove temporary credential
        if: always()
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
        run: |
          if [[ -n "$ASC_KEY_PATH" ]]; then
            rm -f "$ASC_KEY_PATH"
          fi

  # iTunes Lookup cannot see TestFlight builds. After the iOS binary is already on
  # App Store Connect, open a pull request that records the version and build.
  # master is protected, so this job does not push the feed there. It does not
  # download, archive, or upload an app binary.
  publish-update-feed:
    name: Publish TestFlight update feed
    needs: [prepare, upload]
    if: needs.prepare.outputs.should_release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform != 'macos')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Same shape as blinky-bot's appcast step: push a feed branch, open a
      # pull request, and do not push the default branch. Opening the pull
      # request needs Settings → Actions → General → Workflow permissions →
      # "Allow GitHub Actions to create and approve pull requests". Without
      # that, the branch push still stands and a person opens the pull request.
      # Auto-merge is requested only when the repository allows it.
      - name: Open a pull request for update-check.json
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Refusing an unexpected marketing version." >&2
            exit 1
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Refusing an unexpected build number." >&2
            exit 1
          fi
          if [[ ! -f Scripts/bump-update-check.sh ]]; then
            echo "Scripts/bump-update-check.sh is missing from this release commit." >&2
            exit 1
          fi
          script_path="$(mktemp)"
          cp Scripts/bump-update-check.sh "$script_path"
          branch="update-check-${MARKETING_VERSION}-${BUILD_NUMBER}"
          git fetch origin master
          git checkout -B "$branch" origin/master
          bash "$script_path" "$MARKETING_VERSION" "$BUILD_NUMBER" update-check.json
          git add update-check.json
          if git diff --cached --quiet; then
            echo "update-check.json already matches ${MARKETING_VERSION} (${BUILD_NUMBER})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update iOS update-check feed to ${MARKETING_VERSION} (${BUILD_NUMBER})"
          git push --force origin "HEAD:refs/heads/${branch}"
          existing="$(gh pr list --head "$branch" --base master --state open --json number --jq '.[0].number // empty' || true)"
          if [[ -z "$existing" ]]; then
            if ! gh pr create --base master --head "$branch" \
              --title "Update iOS update-check feed to ${MARKETING_VERSION} (${BUILD_NUMBER})" \
              --body "TestFlight build ${MARKETING_VERSION} (${BUILD_NUMBER}) is already on App Store Connect. Merge this pull request to publish update-check.json on master. The release workflow does not push to master."; then
              echo "::warning::Could not open a pull request for ${branch}. The branch was pushed. Open the pull request by hand and merge it. Settings → Actions → General → Workflow permissions must include \"Allow GitHub Actions to create and approve pull requests\" if Actions should open it. The TestFlight upload already stands."
              exit 0
            fi
          fi
          number="$(gh pr list --head "$branch" --base master --state open --json number --jq '.[0].number // empty' || true)"
          if [[ -z "$number" ]]; then
            echo "::warning::Branch ${branch} was pushed, and no open pull request was found. Open it by hand and merge it. The TestFlight upload already stands."
            exit 0
          fi
          if gh pr merge "$number" --squash --auto; then
            echo "Auto-merge is enabled for update-check pull request #${number}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Update-check pull request #${number} is open. Auto-merge is not enabled, so merge it after CI. The workflow does not push to master." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Submission is deliberately manual-only: neither the daily cron nor a testflight-* tag can
  # reach it, so a routine TestFlight build never turns into an App Store review submission.
  submit:
    needs: [prepare, upload]
    if: github.event_name == 'workflow_dispatch' && inputs.submit_for_review
    name: Submit for review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare App Store Connect credential
        id: credential
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$PRIVATE_KEY" || -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$APPLE_TEAM_ID" ]]; then
            echo "TestFlight upload is blocked until these GitHub Actions secrets exist:" >&2
            [[ -z "$KEY_ID" ]] && echo " - APP_STORE_CONNECT_KEY_ID" >&2
            [[ -z "$ISSUER_ID" ]] && echo " - APP_STORE_CONNECT_ISSUER_ID" >&2
            [[ -z "$PRIVATE_KEY" ]] && echo " - APP_STORE_CONNECT_PRIVATE_KEY" >&2
            [[ -z "$APPLE_TEAM_ID" ]] && echo " - APPLE_TEAM_ID" >&2
            echo "See README.md for the Apple Developer setup these secrets belong to." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Submit to App Store review
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_IDENTIFIER != '' && vars.APP_BUNDLE_IDENTIFIER || 'com.harrisliangsu.whenreset' }}
          MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          REVIEW_PLATFORMS: ${{ inputs.platform == 'both' && 'IOS,MAC_OS' || inputs.platform == 'macos' && 'MAC_OS' || 'IOS' }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: ruby .github/scripts/submit-for-review.rb

      - name: Remove temporary credential
        if: always() && steps.credential.outputs.path != ''
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
        run: rm -f "$ASC_KEY_PATH"
