name: App Store Release

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    tags:
      - testflight-*
  workflow_dispatch:
    inputs:
      platform:
        description: Platform archive to upload
        required: true
        default: both
        type: choice
        options:
          - both
          - ios
          - macos
      submit_for_review:
        description: Submit the uploaded build for App Store review
        required: false
        default: false
        type: boolean
      release_notes:
        description: "What's New text for the App Store version (required to submit)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_guard.outputs.should_release }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.next_build.outputs.build_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release only new commits on the daily schedule
        id: release_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git tag --points-at HEAD --list 'testflight-*' | grep -q . \
            || git tag --points-at HEAD --list 'daily-release-*' | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No commits have landed since the last TestFlight release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read marketing version
        if: steps.release_guard.outputs.should_release == 'true'
        id: version
        run: |
          marketing_version=$(awk '/MARKETING_VERSION = / { gsub(";", "", $3); print $3; exit }' WhenReset.xcodeproj/project.pbxproj)
          if [[ -z "$marketing_version" ]]; then
            echo "Could not read MARKETING_VERSION." >&2
            exit 1
          fi
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"

      - name: Prepare App Store Connect credential
        if: steps.release_guard.outputs.should_release == 'true'
        id: credential
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [[ -z "$PRIVATE_KEY" || -z "$KEY_ID" || -z "$ISSUER_ID" ]]; then
            echo "Required App Store Connect secrets are missing." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Select next App Store build number
        if: steps.release_guard.outputs.should_release == 'true'
        id: next_build
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: ad.neko.when
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: ruby .github/scripts/next-app-store-build.rb

      - name: Remove temporary credential
        if: always() && steps.credential.outputs.path != ''
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
        run: rm -f "$ASC_KEY_PATH"

  upload:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: Upload ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(github.event_name == 'schedule' && '["ios"]' || inputs.platform == 'both' && '["ios", "macos"]' || inputs.platform == 'macos' && '["macos"]' || '["ios"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Prepare App Store Connect credential
        id: credential
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [[ -z "$PRIVATE_KEY" || -z "$KEY_ID" || -z "$ISSUER_ID" ]]; then
            echo "Required App Store Connect secrets are missing." >&2
            exit 1
          fi

          key_directory="$RUNNER_TEMP/app-store-connect"
          key_path="$key_directory/AuthKey_${KEY_ID}.p8"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$key_path"

          if ! openssl pkey -in "$key_path" -noout -check >/dev/null 2>&1; then
            echo "The App Store Connect private-key secret is invalid." >&2
            exit 1
          fi

          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$RELEASE_PLATFORM" == "ios" ]]; then
            destination='generic/platform=iOS'
            archive_path="$RUNNER_TEMP/WhenReset-iOS.xcarchive"
            platform_settings=()
          else
            destination='generic/platform=macOS'
            archive_path="$RUNNER_TEMP/WhenReset-macOS.xcarchive"
            platform_settings=("ARCHS=arm64 x86_64" "ONLY_ACTIVE_ARCH=NO")
          fi

          xcodebuild archive \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination "$destination" \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION='${{ needs.prepare.outputs.marketing_version }}' \
            CURRENT_PROJECT_VERSION='${{ needs.prepare.outputs.build_number }}' \
            "${platform_settings[@]}"

          if [[ "$RELEASE_PLATFORM" == "macos" ]]; then
            app_path="$archive_path/Products/Applications/WhenReset.app"
            widget_path="$app_path/Contents/PlugIns/WhenResetWidgets.appex"
            app_entitlements="$RUNNER_TEMP/WhenResetMac.xcent"
            widget_entitlements="$RUNNER_TEMP/WhenResetWidgetsMac.xcent"
            team_id=7P8CLHDH5G
            app_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")
            widget_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget_path/Contents/Info.plist")

            cp WhenReset/WhenResetMac.entitlements "$app_entitlements"
            cp WhenResetWidgets/WhenResetWidgetsMac.entitlements "$widget_entitlements"

            /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.aps-environment production' "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Set :keychain-access-groups:0 ${team_id}.ad.neko.when.shared" "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string ${team_id}.${app_bundle_id}" "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $team_id" "$app_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string ${team_id}.${widget_bundle_id}" "$widget_entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $team_id" "$widget_entitlements"

            codesign --force --sign - --entitlements "$widget_entitlements" --generate-entitlement-der "$widget_path"
            codesign --force --sign - --entitlements "$app_entitlements" --generate-entitlement-der "$app_path"
            codesign --verify --deep --strict "$app_path"

            for bundle in "$app_path" "$widget_path"; do
              signed_entitlements="$RUNNER_TEMP/$(basename "$bundle").signed.xcent"
              codesign -d --entitlements :- "$bundle" > "$signed_entitlements" 2>/dev/null
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$signed_entitlements")" == "true" ]]
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$signed_entitlements")" == "group.ad.neko.when" ]]
              bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.application-identifier' "$signed_entitlements")" == "${team_id}.${bundle_id}" ]]
              [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$signed_entitlements")" == "$team_id" ]]
            done

            app_signed_entitlements="$RUNNER_TEMP/WhenReset.app.signed.xcent"
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$app_signed_entitlements")" == "true" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' "$app_signed_entitlements")" == "production" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$app_signed_entitlements")" == "${team_id}.ad.neko.when.shared" ]]
          fi

          echo "archive_path=$archive_path" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/AppStoreExport"

          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string automatic "$export_options"
          plutil -insert teamID -string 7P8CLHDH5G "$export_options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$export_options"
          plutil -insert uploadSymbols -bool YES "$export_options"

          PATH=/usr/bin:/bin:/usr/sbin:/sbin xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Uploaded ${{ matrix.platform }} archive ${{ needs.prepare.outputs.marketing_version }} (${{ needs.prepare.outputs.build_number }}) to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Read archived iOS version
        if: matrix.platform == 'ios'
        run: |
          marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$archive_path/Info.plist")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$archive_path/Info.plist")
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Add iOS build to Internal Testers
        if: matrix.platform == 'ios'
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: ad.neko.when
          TESTFLIGHT_GROUP_NAME: Internal Testers
        run: ruby .github/scripts/assign-testflight-group.rb

      - name: Mark successful automatic release
        if: matrix.platform == 'ios' && github.event_name != 'push'
        env:
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          tag="daily-release-${MARKETING_VERSION}-${BUILD_NUMBER}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Remove temporary credential
        if: always()
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
        run: |
          if [[ -n "$ASC_KEY_PATH" ]]; then
            rm -f "$ASC_KEY_PATH"
          fi

  # Submission is deliberately manual-only: neither the daily cron nor a testflight-* tag can
  # reach it, so a routine TestFlight build never turns into an App Store review submission.
  submit:
    needs: [prepare, upload]
    if: github.event_name == 'workflow_dispatch' && inputs.submit_for_review
    name: Submit for review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare App Store Connect credential
        id: credential
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [[ -z "$PRIVATE_KEY" || -z "$KEY_ID" || -z "$ISSUER_ID" ]]; then
            echo "Required App Store Connect secrets are missing." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Submit to App Store review
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: ad.neko.when
          MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          REVIEW_PLATFORMS: ${{ inputs.platform == 'both' && 'IOS,MAC_OS' || inputs.platform == 'macos' && 'MAC_OS' || 'IOS' }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: ruby .github/scripts/submit-for-review.rb

      - name: Remove temporary credential
        if: always() && steps.credential.outputs.path != ''
        env:
          ASC_KEY_PATH: ${{ steps.credential.outputs.path }}
        run: rm -f "$ASC_KEY_PATH"
