name: CI

on:
  push:
    branches: [master]
  pull_request:
    # The reset-card widget PR is based on the unmerged usage-card branch.
    # Retargeting that PR to master still matches the first entry.
    branches: [master, cursor/ios-product-polish-faf9]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: App Store release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install test runner
        run: gem install minitest --version 5.25.5 --no-document
      - name: Test version selection and safe signing retries
        run: |
          ruby .github/scripts/test-app-store-release.rb
          node --test .github/scripts/test-release-diagnostics.mjs
          bash -n .github/scripts/export-app-store.sh
          shellcheck .github/scripts/export-app-store.sh
          bash -n Scripts/bump-update-check.sh
          shellcheck Scripts/bump-update-check.sh
          bash .github/scripts/check-version-source.sh
          shellcheck .github/scripts/check-version-source.sh
          python3 -c 'import json; d=json.load(open("update-check.json", encoding="utf-8")); ios=d["ios"]; assert ios["version"] and str(ios["build"]).isdigit() and "T" in ios["updatedAt"]'
          tmp="$(mktemp)"
          bash Scripts/bump-update-check.sh 1.2.3 45 "$tmp"
          python3 -c 'import json,sys; from datetime import datetime; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["ios"]["version"]=="1.2.3" and d["ios"]["build"]=="45"; datetime.strptime(d["ios"]["updatedAt"], "%Y-%m-%dT%H:%M:%SZ")' "$tmp"
          if bash Scripts/bump-update-check.sh 1.2.3 not-a-build "$tmp"; then
            echo "bump-update-check.sh accepted a non-numeric build" >&2
            exit 1
          fi

  secrets:
    name: Secret disclosure checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked private files and the intentional public APNs key
        run: node server/scripts/check-public-secrets.mjs
      - name: Scan full Git history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner --log-opts=--all .

  app:
    name: iOS and macOS
    # Standard Intel image. It has Xcode 26.3, and it is a different pool
    # from the arm64 macOS runners that GitHub cancels after 15 minutes
    # with runner_id 0. timeout-minutes starts only after a runner starts
    # the job. macos-15-large is a paid larger runner and is not required.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: ./.github/actions/select-xcode

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate the Xcode project
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Run iOS unit tests
        run: |
          run_tests() {
            local attempt="$1"
            # Ad-hoc identity so simulator Keychain tests run. An unsigned host
            # returns OSStatus -34018. This does not use an Apple team or secret.
            xcodebuild test \
              -project WhenReset.xcodeproj \
              -scheme WhenReset \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS-Tests" \
              -resultBundlePath "$RUNNER_TEMP/WhenResetTests-${attempt}.xcresult" \
              CODE_SIGN_STYLE=Manual \
              "CODE_SIGN_IDENTITY=-" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=YES \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER=
          }

          set +e
          run_tests 1
          status=$?
          set -e

          if [[ "$status" -eq 70 ]]; then
            echo "Xcode reported simulator infrastructure failure (exit 70); retrying once."
            xcrun simctl shutdown all || true
            run_tests 2
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Build iOS release configuration
        run: |
          xcodebuild build \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal macOS release configuration
        run: |
          xcodebuild build \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO

  worker:
    name: Cloudflare Worker and Linux server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Check Linux runtime and installer
        run: |
          npm run check:linux
          npm run test:linux
          npm run build:linux
          bash -n install.sh
          shellcheck install.sh scripts/test-linux-install.sh

      - name: Test Linux installation and upgrade
        run: sudo env WHEN_RESET_INSTALL_TEST=1 bash scripts/test-linux-install.sh

  screenshots:
    name: Simulator screenshots
    needs: app
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ui-screenshots.yml
