name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: iOS and macOS
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run iOS unit tests
        run: |
          xcodebuild test \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS-Tests" \
            -resultBundlePath "$RUNNER_TEMP/WhenResetTests.xcresult"

      - name: Build iOS release configuration
        run: |
          xcodebuild build \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal macOS release configuration
        run: |
          xcodebuild build \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test
