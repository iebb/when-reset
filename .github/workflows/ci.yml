name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: App Store release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install test runner
        run: gem install minitest --version 5.25.5 --no-document
      - name: Test version selection and safe signing retries
        run: |
          ruby .github/scripts/test-app-store-release.rb
          bash -n .github/scripts/export-app-store.sh
          shellcheck .github/scripts/export-app-store.sh

  secrets:
    name: Secret disclosure checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked private files and the intentional public APNs key
        run: node server/scripts/check-public-secrets.mjs
      - name: Scan full Git history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner --log-opts=--all .

  app:
    name: iOS and macOS
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run iOS unit tests
        run: |
          run_tests() {
            local attempt="$1"
            xcodebuild test \
              -project WhenReset.xcodeproj \
              -scheme WhenReset \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS-Tests" \
              -resultBundlePath "$RUNNER_TEMP/WhenResetTests-${attempt}.xcresult"
          }

          set +e
          run_tests 1
          status=$?
          set -e

          if [[ "$status" -eq 70 ]]; then
            echo "Xcode reported simulator infrastructure failure (exit 70); retrying once."
            xcrun simctl shutdown all || true
            run_tests 2
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Build iOS release configuration
        run: |
          xcodebuild build \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal macOS release configuration
        run: |
          xcodebuild build \
            -project WhenReset.xcodeproj \
            -scheme WhenReset \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO

  worker:
    name: Cloudflare Worker and Linux server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Check Linux runtime and installer
        run: |
          npm run check:linux
          npm run test:linux
          npm run build:linux
          bash -n install.sh
          shellcheck install.sh scripts/test-linux-install.sh

      - name: Test Linux installation and upgrade
        run: sudo env WHEN_RESET_INSTALL_TEST=1 bash scripts/test-linux-install.sh
