name: WhenReset
options:
  developmentLanguage: en
  bundleIdPrefix: com.harrisliangsu
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/WhenReset.xcconfig
  Release: Config/WhenReset.xcconfig
settings:
  base:
    # Bump the marketing version and build number only here, then run
    # `xcodegen generate --spec project.yml` and commit the Xcode project.
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.10"
    CURRENT_PROJECT_VERSION: "35"
targets:
  WhenReset:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    sources:
      - path: WhenReset
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_IDENTIFIER)"
        ASSETCATALOG_COMPILER_APPICON_NAME: reset
        INFOPLIST_FILE: WhenReset/Info.plist
        "INFOPLIST_FILE[sdk=macosx*]": WhenReset/Info-Mac.plist
        CODE_SIGN_ENTITLEMENTS: WhenReset/WhenReset.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WhenReset/WhenResetMac.entitlements
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: WhenResetWidgets
    scheme:
      testTargets:
        - WhenResetTests
  WhenResetWidgets:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: WhenResetWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIDGET_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: WhenResetWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhenResetWidgets/WhenResetWidgets.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WhenResetWidgets/WhenResetWidgetsMac.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  WhenResetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WhenResetTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_IDENTIFIER).tests"
    dependencies:
      - target: WhenReset
  WhenResetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WhenResetUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_IDENTIFIER).uitests"
        TEST_TARGET_NAME: WhenReset
    dependencies:
      - target: WhenReset
schemes:
  Screenshots:
    build:
      targets:
        WhenReset: all
        WhenResetTests: [test]
        WhenResetUITests: [test]
    test:
      targets:
        - name: WhenResetUITests
        - name: WhenResetTests
